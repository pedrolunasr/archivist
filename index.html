<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#201b18">
  <title>archivist</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div>
        <p class="eyebrow">Private collection · Investigation records</p>
        <h1>archivist</h1>
        <p class="subtitle">Recovered records, carefully preserved for examination.</p>
      </div>
    </header>
    <main>
      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <div>
            <p class="eyebrow">The collection</p>
            <h2 id="catalog-title">Available archives</h2>
          </div>
          <span class="count" id="archive-count">— archives</span>
        </div>
        <label for="search">Search the archives</label>
        <input id="search" type="search" placeholder="Number..." autocomplete="off">
        <p class="status" id="status" role="status" aria-live="polite">Loading archives...</p>
        <div class="archives" id="archives"></div>
      </section>
    </main>
    <footer>archivist <span aria-hidden="true">✦</span> For investigators only</footer>
  </div>
</body>
</html>
